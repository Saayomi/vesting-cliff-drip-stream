name: Issue 980 validation
on:
  push:
    branches: [validation/980-drain-f42a]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: '1.88.0'
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Full contract tests
        continue-on-error: true
        run: cargo test -p vesting-cliff-drip-stream --lib --features testutils
      - name: WASM build
        if: always()
        run: cargo build -p vesting-cliff-drip-stream --target wasm32v1-none --release
      - name: Format check
        if: always()
        run: cargo fmt --all -- --check
      - name: Clippy
        if: always()
        run: cargo clippy -p vesting-cliff-drip-stream --all-targets --all-features -- -D warnings
